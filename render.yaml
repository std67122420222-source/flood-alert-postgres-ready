services:
  - type: web
    name: flood-alert
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TMD_ACCESS_TOKEN
        sync: false
      - key: TMD_WARNING_URL
        value: https://data.tmd.go.th/api/WeatherWarningNews/v2/
